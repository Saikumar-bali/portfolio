<style>
  .ink{stroke:#30312c;stroke-linecap:round;stroke-linejoin:round}.fine{stroke:#77766d;stroke-linecap:round;stroke-linejoin:round}.head{transform-box:fill-box;transform-origin:50% 85%;animation:think 5.8s ease-in-out infinite}.working-arm{transform-box:fill-box;transform-origin:10% 15%;animation:work 3.6s ease-in-out infinite}.cursor-star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s linear infinite}.steam{stroke-dasharray:70;stroke-dashoffset:70;animation:steam 3.2s ease-in-out infinite}
  @keyframes think{0%,100%{transform:rotate(0)}48%{transform:rotate(-1.4deg)}65%{transform:rotate(.6deg)}}@keyframes work{0%,100%{transform:rotate(0)}45%{transform:rotate(-1.8deg)}66%{transform:rotate(.7deg)}}@keyframes twinkle{0%,68%,100%{opacity:.25;transform:scale(.84) rotate(-8deg)}78%{opacity:1;transform:scale(1.08) rotate(8deg)}}@keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47.5%{transform:scaleY(.12)}}@keyframes steam{0%{stroke-dashoffset:70;opacity:0}24%{opacity:.7}73%{stroke-dashoffset:0;opacity:.2}100%{stroke-dashoffset:0;opacity:0}}
  @media(prefers-reduced-motion:reduce){.head,.working-arm,.cursor-star,.blink,.steam{animation:none!important}}
</style>
